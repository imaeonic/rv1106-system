name: Build firmware
permissions:
  contents: write

on:
  workflow_dispatch:

concurrency:
  group: prototype-firmware-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - board: EMMC
            sku: jetkvm-v2
          - board: SDMMC
            sku: jetkvm-v2-sdmmc
    name: Build (${{ matrix.board }})
    steps:
      - name: Checkout firmware
        uses: actions/checkout@v4

      - name: Checkout RDP-enabled JetKVM app
        uses: actions/checkout@v4
        with:
          repository: imaeonic/jetkvm
          ref: feature/rdp-console
          path: _rdp-app

      - name: Set up build dependencies
        run: |
          sudo apt-get update &&
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf autotools-dev \
            device-tree-compiler \
            gperf g++-multilib gcc-multilib \
            libnl-3-dev libdbus-1-dev libelf-dev libmpc-dev dwarves \
            zip

      - name: Prepare JetKVM app build context
        working-directory: _rdp-app
        run: ./scripts/ci_helper.sh prepare
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ env.DOCKER_BUILD_CONTEXT_DIR }}
          file: ${{ env.DOCKER_BUILD_CONTEXT_DIR }}/Dockerfile.build
          tags: ${{ env.DOCKER_BUILD_TAG }}
          push: false
          load: true
      - uses: actions/setup-go@v6
        with:
          go-version: '^1.25.1'
      - name: Build RDP-enabled jetkvm_app
        working-directory: _rdp-app
        run: ./scripts/ci_helper.sh make build_dev SKIP_UI_BUILD=1

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'
          targets: armv7-unknown-linux-musleabihf
      - name: Install Rust cross compiler wrapper
        run: cargo install cross --locked
      - name: Build static RDP transport
        working-directory: project/app/jetkvm/rdp-console
        run: cross build --release --target armv7-unknown-linux-musleabihf

      - name: Install prototype application binary
        run: |
          install -m 0755 _rdp-app/bin/jetkvm_app project/app/jetkvm/jetkvm/bin/jetkvm_app
          file _rdp-app/bin/jetkvm_app
          file project/app/jetkvm/rdp-console/target/armv7-unknown-linux-musleabihf/release/jetkvm-rdp

      - name: Get build version
        run: |
          export BUILD_VERSION=$(cat VERSION)
          export BUILD_VERSION_SOURCE="file"
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            export BUILD_VERSION="$BUILD_VERSION-$(echo $GITHUB_REF | sed 's/refs\/heads\///' | sed 's/\//-/')$(date +%Y%m%d%H%M)"
            export BUILD_VERSION_SOURCE="branch"
          fi
          echo "BUILD_VERSION=$BUILD_VERSION" >> $GITHUB_ENV
          echo "BUILD_VERSION_SOURCE=$BUILD_VERSION_SOURCE" >> $GITHUB_ENV
          echo "$BUILD_VERSION" > VERSION

      - name: Build complete RDP prototype firmware
        run: |
          echo "Version: $BUILD_VERSION (from $BUILD_VERSION_SOURCE)"
          export JETKVM_RDP_BIN="$GITHUB_WORKSPACE/project/app/jetkvm/rdp-console/target/armv7-unknown-linux-musleabihf/release/jetkvm-rdp"
          ./build.sh lunch BoardConfig_IPC/BoardConfig-${{ matrix.board }}-NONE-RV1106_JETKVM_V2.mk
          ./build.sh

      - name: Upload OTA image
        uses: actions/upload-artifact@v4
        with:
          name: OTA-Image-${{ matrix.board }}
          path: output/image/update_ota.tar
          retention-days: 7
      - name: Upload Full image (EMMC)
        if: matrix.board == 'EMMC'
        uses: actions/upload-artifact@v4
        with:
          name: Full-Image-EMMC
          path: output/image/update.img
          retention-days: 7
      - name: Upload SD image (SDMMC)
        if: matrix.board == 'SDMMC'
        uses: actions/upload-artifact@v4
        with:
          name: SD-Image-SDMMC
          path: output/image/update_sd.img.zip
          retention-days: 7
          compression-level: 0
      - name: Create compressed buildkit
        if: matrix.board == 'EMMC'
        run: ./make_buildkit.sh
      - name: Upload buildkit
        if: matrix.board == 'EMMC'
        uses: actions/upload-artifact@v4
        with:
          name: jetkvm-native-buildkit
          path: buildkit.tar.zst
          retention-days: 7
          compression-level: 0
