name: RDP Console

on:
  push:
    branches: [dev, feature/rdp-console]
    paths:
      - 'project/app/jetkvm/rdp-console/**'
      - '.github/workflows/rdp-console.yml'
  pull_request:
    paths:
      - 'project/app/jetkvm/rdp-console/**'
      - '.github/workflows/rdp-console.yml'
  workflow_dispatch:

concurrency:
  group: rdp-console-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/app/jetkvm/rdp-console
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'
          components: clippy
      - name: Compile daemon
        run: cargo check
      - name: Clippy
        run: cargo clippy --all-targets

  armv7:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/app/jetkvm/rdp-console
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'
          targets: armv7-unknown-linux-musleabihf
      - name: Install cross
        run: cargo install cross --locked
      - name: Build static ARMv7 hard-float daemon
        run: cross build --release --target armv7-unknown-linux-musleabihf
      - uses: actions/upload-artifact@v4
        with:
          name: jetkvm-rdp-armv7-musl
          path: project/app/jetkvm/rdp-console/target/armv7-unknown-linux-musleabihf/release/jetkvm-rdp
          if-no-files-found: error
