[package]
name = "jetkvm-rdp"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "GPL-2.0-only"
description = "RDP transport for JetKVM physical console"

[dependencies]
anyhow = "1"
async-trait = "0.1"
bytes = "1"
ironrdp-displaycontrol = "0.8"
ironrdp-egfx = "0.3"
ironrdp-server = { version = "0.13", default-features = false, features = ["egfx"] }
tokio = { version = "1", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
