name: RDP Console

on:
  push:
    branches: [dev, feature/rdp-console]
    paths:
      - 'project/app/jetkvm/rdp-console/**'
      - 'scripts/rdp_source_fix.py'
      - '.github/workflows/rdp-console.yml'
  pull_request:
    paths:
      - 'project/app/jetkvm/rdp-console/**'
      - 'scripts/rdp_source_fix.py'
      - '.github/workflows/rdp-console.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rdp-console-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  source-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rdp-console
          fetch-depth: 0
      - name: Apply deterministic source fixes
        run: python scripts/rdp_source_fix.py
      - name: Commit source fixes when required
        shell: bash
        run: |
          if git diff --quiet; then
            echo "RDP sources already fixed"
            exit 0
          fi
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project/app/jetkvm/rdp-console/Cargo.toml project/app/jetkvm/rdp-console/src/main.rs
          git commit -m "fix: compile RDP console against pinned IronRDP"
          git push origin HEAD:feature/rdp-console

  check:
    needs: source-fix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/app/jetkvm/rdp-console
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rdp-console
      - run: python scripts/rdp_source_fix.py
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'
          components: clippy
      - name: Compile daemon
        run: cargo check
      - name: Clippy
        run: cargo clippy --all-targets

  armv7:
    needs: source-fix
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: project/app/jetkvm/rdp-console
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/rdp-console
      - run: python scripts/rdp_source_fix.py
        working-directory: .
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.94.0'
          targets: armv7-unknown-linux-musleabihf
      - name: Install cross
        run: cargo install cross --locked
      - name: Build static ARMv7 hard-float daemon
        run: cross build --release --target armv7-unknown-linux-musleabihf
      - uses: actions/upload-artifact@v4
        with:
          name: jetkvm-rdp-armv7-musl
          path: project/app/jetkvm/rdp-console/target/armv7-unknown-linux-musleabihf/release/jetkvm-rdp
          if-no-files-found: error
